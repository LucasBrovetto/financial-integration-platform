name: Acquirer Simulator CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "services/acquirer-simulator/**"
      - "services/transaction-service/mvnw"
      - "services/transaction-service/mvnw.cmd"
      - "services/transaction-service/.mvn/**"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - "pom.xml"
      - ".github/workflows/acquirer-simulator-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "services/acquirer-simulator/**"
      - "services/transaction-service/mvnw"
      - "services/transaction-service/mvnw.cmd"
      - "services/transaction-service/.mvn/**"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - "pom.xml"
      - ".github/workflows/acquirer-simulator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acquirer-simulator-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquirer-simulator:
    name: Acquirer simulator
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            services/acquirer-simulator/pom.xml

      - name: Verify acquirer simulator
        run: ./mvnw --batch-mode --no-transfer-progress -pl services/acquirer-simulator -am verify
